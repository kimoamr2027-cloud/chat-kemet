name: النشر على Cloudflare Pages (chatkemet.pages.dev)

# بينشر نفس الموقع على دومين لوحده (من غير /chat-kemet/)
# محتاج في Secrets: CLOUDFLARE_API_TOKEN (صلاحية Cloudflare Pages: تحرير بس). رقم الحساب مش سر فمكتوب هنا
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '96703188d383944407548666457a1692' }}
    steps:
      - name: فيه مفتاح؟
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::لسه مفيش CLOUDFLARE_API_TOKEN في Secrets"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20
          cache: npm
      - if: env.SKIP != '1'
        run: npm ci
      - name: بناء الموقع للدومين الجديد
        if: env.SKIP != '1'
        run: npm run build
        env:
          VITE_BACKEND: pb
          VITE_BASE: /
      - name: عمل المشروع (أول مرة بس)
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages project create chatkemet --production-branch main || echo "المشروع موجود"
      - name: النشر
        if: env.SKIP != '1'
        run: npx --yes wrangler@3 pages deploy dist --project-name chatkemet --branch main --commit-dirty=true
