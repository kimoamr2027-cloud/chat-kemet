name: النشر على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # الشات الأساسي بقى على سيرفرنا (PocketBase على Oracle). الدخول لسه بجوجل/Firebase
      - run: npm run build
        env:
          VITE_BACKEND: pb
          VITE_BASE: /chat-kemet/
      - run: cp dist/index.html dist/404.html
      # النسخة التجريبية على سيرفر PocketBase: /chat-kemet/pb/
      - run: VITE_BACKEND=pb npx vite build --outDir dist/pb --emptyOutDir false
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
