name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # مفتاح التوقيع: لو متحط في Secrets بنستخدمه (علشان التحديثات تتسطّب فوق القديم)،
      # ولو مش موجود بنعمل مفتاح مؤقت
      - name: مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=ثابت" >> "$GITHUB_ENV"
          else
            PW="kemet-$(openssl rand -hex 12)"
            keytool -genkeypair -v -keystore android/app/release.jks -alias kemet -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Chat Kemet, O=Kemet, C=EG"
            echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING=مؤقت" >> "$GITHUB_ENV"
          fi

      - name: بناء الـ APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: release.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملف
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk chat-kemet.apk
          echo "FINGERPRINT=$(keytool -list -v -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" | grep 'SHA256:' | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: نشر الـ APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: شات كيمت للأندرويد — نسخة ${{ github.run_number }}
          make_latest: true
          files: chat-kemet.apk
          body: |
            حمّل **chat-kemet.apk** من تحت وسطّبه على الموبايل.
            التوقيع: ${{ env.SIGNING }}
            SHA-256: `${{ env.FINGERPRINT }}`
