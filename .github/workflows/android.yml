name: بناء تطبيق أندرويد (APK)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # مفتاح التوقيع الثابت: بيتعمل أول مرة بس وبيتشفّر بالباسورد اللي في Secrets (ANDROID_SIGN_PASS)
      # ويتحفظ في android/sign.jks.enc، ومعاه assetlinks.json للدومين (علشان التطبيق يفتح من غير شريط اللينك)
      - name: مفتاح التوقيع
        env:
          SIGN_PASS: ${{ secrets.ANDROID_SIGN_PASS }}
        run: |
          if [ -z "$SIGN_PASS" ]; then
            echo "::warning::مفيش ANDROID_SIGN_PASS في Secrets — حطه وشغّل تاني"
            echo "SKIP=1" >> "$GITHUB_ENV"; exit 0
          fi
          printf '%s' "$SIGN_PASS" > /tmp/kp
          if [ -f android/sign.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass file:/tmp/kp -in android/sign.jks.enc -out android/app/release.jks
          else
            keytool -genkeypair -keystore android/app/release.jks -alias kemet -keyalg RSA -keysize 2048 -validity 20000 \
              -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" -dname "CN=Chat Kemet, O=Kemet, C=EG"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass file:/tmp/kp -in android/app/release.jks -out android/sign.jks.enc
            echo "NEWKEY=1" >> "$GITHUB_ENV"
          fi
          rm -f /tmp/kp
          echo "KEYSTORE_PASSWORD=$SIGN_PASS" >> "$GITHUB_ENV"
          FP=$(keytool -list -v -keystore android/app/release.jks -storepass "$SIGN_PASS" | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "FINGERPRINT=$FP" >> "$GITHUB_ENV"
          mkdir -p public/.well-known
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.kemet.chat","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > public/.well-known/assetlinks.json
          echo "SIGNING=ثابت" >> "$GITHUB_ENV"

      # أول مرة: نحفظ المفتاح المتشفّر و assetlinks في المشروع، وننشر الموقع تاني علشان assetlinks يوصل للدومين
      - name: حفظ المفتاح
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/sign.jks.enc public/.well-known/assetlinks.json
          if ! git diff --cached --quiet; then
            git commit -m "APK: مفتاح التوقيع الثابت (متشفّر) و assetlinks للدومين"
            git push
            gh workflow run cloudflare.yml --ref main || true
          fi

      - name: بناء الـ APK
        if: env.SKIP != '1'
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: release.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: تجهيز الملف
        if: env.SKIP != '1'
        run: cp android/app/build/outputs/apk/release/app-release.apk chat-kemet.apk

      - name: نشر الـ APK
        if: env.SKIP != '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: شات كيمت للأندرويد — نسخة ${{ github.run_number }}
          make_latest: true
          files: chat-kemet.apk
          body: |
            حمّل **chat-kemet.apk** من تحت وسطّبه على الموبايل.
            التوقيع: ${{ env.SIGNING }}
            SHA-256: `${{ env.FINGERPRINT }}`
