<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شات كيمت - غرف الدردشة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A4E14}a:hover{color:#5C3A0E}
input::placeholder{color:#8A8178}
.kemet-bg{background-color:#F7F1E6;background-image:url(../assets/kemet-pattern.svg);background-size:200px 200px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F4; font-family: 'Cairo', 'Tahoma', sans-serif; color: #1F1A14; display: flex; flex-direction: column; position: relative">

  <div style="padding: 48px 20px 12px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #ECE6DC">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; flex-grow: 1; font-size: 26px; font-weight: 800">غرف الدردشة</h1>
      <a href="Notifications.dc.html" aria-label="الإشعارات، فيه جديد" style="position: relative; width: 44px; height: 44px; margin-left: 8px; border-radius: 50%; background: #F3EFE8; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
        <span aria-hidden="true" style="position: absolute; top: 6px; left: 8px; width: 10px; height: 10px; border-radius: 50%; background: #D93025; border: 2px solid #FFFFFF"></span>
      </a>
      <a href="Profile.dc.html" aria-label="الملف الشخصي" style="width: 44px; height: 44px; border-radius: 50%; background: #F1E6D3; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#7A4E14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      </a>
    </div>
    <div style="height: 46px; border-radius: 14px; background: #F3EFE8; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">بحث</label>
      <input id="search" type="text" placeholder="ابحث عن غرفة" style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #1F1A14; outline: none">
    </div>
    <div role="tablist" style="display: flex; gap: 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div class="kemet-bg" style="flex-grow: 1; overflow-y: auto; padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="5">
      <a href="Room.dc.html" style="text-decoration: none; color: #1F1A14; background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px">
        <div aria-hidden="true" style="{{r.avatar}}">{{r.initial}}</div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
            <span style="font-size: 12px; color: #6B6259">{{r.time}}</span>
          </div>
          <span style="font-size: 13px; color: #6B6259; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.last}}</span>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #2F6B3A; font-weight: 600">
            <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #2F8A43"></span>{{r.online}} متصل الآن
          </div>
        </div>
        <sc-if value="{{r.hasUnread}}" hint-placeholder-val="{{ true }}">
          <span style="min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{r.unread}}</span>
        </sc-if>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECE6DC; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Rooms.dc.html" style="text-decoration: none; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"></path><path d="M9 20v-6h6v6"></path></svg>
      الغرف
    </a>
    <a href="Messages.dc.html" style="text-decoration: none; color: #6B6259; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
      الرسائل
    </a>
    <a href="Profile.dc.html" style="text-decoration: none; color: #6B6259; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      حسابي
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5A1C","options":["#8A5A1C","#1F1A14","#5B3FD1","#2E6E8E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const accent = this.props.accent ?? '#8A5A1C';
    const tabBase = 'height: 36px; padding: 0 16px; border-radius: 18px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ';
    const tabs = [
      { id: 'all', label: 'الكل' },
      { id: 'active', label: 'الأكثر نشاطًا' },
      { id: 'mine', label: 'غرفي' }
    ].map((t) => {
      const sel = this.state.tab === t.id;
      return {
        ...t,
        sel: sel ? 'true' : 'false',
        style: tabBase + (sel ? 'border: none; background: ' + accent + '; color: #FFFFFF' : 'border: 1px solid #D9D2C7; background: #FFFFFF; color: #1F1A14'),
        pick: () => this.setState({ tab: t.id })
      };
    });
    const tints = [['#F1E6D3', '#7A4E14'], ['#DCEBF2', '#1F5A75'], ['#E3EEDF', '#2F6B3A'], ['#EFE3F3', '#6A3A7E'], ['#F6E2DA', '#8A3B1E'], ['#E6E4F5', '#3E3A8A']];
    const all = [
      { name: 'غرفة الأهرامات', last: 'أحمد: مين جاي الرحلة الجمعة؟', time: '٩:١٥', online: 24, unread: 3, mine: true },
      { name: 'نهر النيل', last: 'سارة: الصور طلعت تحفة', time: '٨:٥٠', online: 41, unread: 0, mine: false },
      { name: 'الأقصر وأسوان', last: 'محمد: حد يعرف فندق كويس؟', time: '٨:٢٠', online: 12, unread: 5, mine: true },
      { name: 'إسكندرية', last: 'نور: البحر النهارده هادي', time: 'أمس', online: 18, unread: 0, mine: false },
      { name: 'شباب كيمت', last: 'يوسف: يلا ماتش النهارده', time: 'أمس', online: 56, unread: 12, mine: true },
      { name: 'تاريخ مصر القديمة', last: 'منى: كتاب جديد عن الفراعنة', time: 'الإثنين', online: 9, unread: 0, mine: false }
    ];
    let list = all;
    if (this.state.tab === 'active') list = all.slice().sort((a, b) => b.online - a.online);
    if (this.state.tab === 'mine') list = all.filter((r) => r.mine);
    const rooms = list.map((r) => {
      const i = all.indexOf(r) % tints.length;
      return {
        ...r,
        initial: r.name.replace('غرفة ', '').charAt(0),
        hasUnread: r.unread > 0,
        avatar: 'width: 52px; height: 52px; flex-shrink: 0; border-radius: 16px; background: ' + tints[i][0] + '; color: ' + tints[i][1] + '; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800'
      };
    });
    return { accent, tabs, rooms };
  }
}
</script>
</body>
</html>
