<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شات كيمت - الرسائل الخاصة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A4E14}a:hover{color:#5C3A0E}
input::placeholder{color:#8A8178}
.kemet-bg{background-color:#F7F1E6;background-image:url(../assets/kemet-pattern.svg);background-size:200px 200px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F4; font-family: 'Cairo', 'Tahoma', sans-serif; color: #1F1A14; display: flex; flex-direction: column; position: relative">

  <div style="padding: 48px 20px 14px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px; border-bottom: 1px solid #ECE6DC">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800">الرسائل الخاصة</h1>
    <div style="height: 46px; border-radius: 14px; background: #F3EFE8; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6259" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="dm-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">بحث</label>
      <input id="dm-search" type="text" placeholder="ابحث عن عضو" style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 15px; color: #1F1A14; outline: none">
    </div>
  </div>

  <div class="kemet-bg" style="flex-grow: 1; overflow-y: auto; padding: 10px 12px 90px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{chats}}" as="c" hint-placeholder-count="6">
      <a href="DM.dc.html" style="text-decoration: none; color: #1F1A14; padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #ECE6DC; border-radius: 18px">
        <div style="position: relative; flex-shrink: 0">
          <div aria-hidden="true" style="{{c.avatar}}">{{c.initial}}</div>
          <sc-if value="{{c.online}}" hint-placeholder-val="{{ true }}">
            <span aria-label="متصل" style="position: absolute; bottom: 1px; left: 1px; width: 14px; height: 14px; border-radius: 50%; background: #2F8A43; border: 2.5px solid #FFFFFF"></span>
          </sc-if>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font-size: 16px; font-weight: 700">{{c.name}}</span>
            <span style="font-size: 12px; color: #6B6259">{{c.time}}</span>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="{{c.lastStyle}}">{{c.last}}</span>
            <sc-if value="{{c.hasUnread}}" hint-placeholder-val="{{ true }}">
              <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{accent}}; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">{{c.unread}}</span>
            </sc-if>
          </div>
        </div>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #FFFFFF; border-top: 1px solid #ECE6DC; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding-bottom: 8px; box-sizing: border-box">
    <a href="Rooms.dc.html" style="text-decoration: none; color: #6B6259; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6v10H3z"></path><path d="M9 20v-6h6v6"></path></svg>
      الغرف
    </a>
    <a href="Messages.dc.html" style="text-decoration: none; color: {{accent}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>
      الرسائل
    </a>
    <a href="Profile.dc.html" style="text-decoration: none; color: #6B6259; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
      حسابي
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5A1C","options":["#8A5A1C","#1F1A14","#5B3FD1","#2E6E8E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#8A5A1C';
    const tints = [['#F1E6D3', '#7A4E14'], ['#DCEBF2', '#1F5A75'], ['#EFE3F3', '#6A3A7E'], ['#E3EEDF', '#2F6B3A'], ['#F6E2DA', '#8A3B1E'], ['#E6E4F5', '#3E3A8A']];
    const all = [
      { name: 'أحمد', last: 'تمام، نتقابل الجمعة', time: '٩:٢٠', unread: '٢', online: true },
      { name: 'سارة', last: 'ابعتلي الصور لما توصل', time: '٩:٠١', unread: '', online: true },
      { name: 'منى', last: 'أنت: شكرًا جدًا', time: '٨:٤٥', unread: '', online: false },
      { name: 'يوسف', last: 'شفت الماتش؟', time: 'أمس', unread: '١', online: true },
      { name: 'نور', last: 'أنت: هكلمك بكره', time: 'أمس', unread: '', online: false },
      { name: 'محمد', last: 'الفندق اسمه إيه؟', time: 'الإثنين', unread: '', online: false }
    ];
    const chats = all.map((c, i) => ({
      ...c,
      initial: c.name.charAt(0),
      hasUnread: !!c.unread,
      lastStyle: 'font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; ' + (c.unread ? 'color: #1F1A14; font-weight: 700' : 'color: #6B6259'),
      avatar: 'width: 54px; height: 54px; border-radius: 50%; background: ' + tints[i][0] + '; color: ' + tints[i][1] + '; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800'
    }));
    return { accent, chats };
  }
}
</script>
</body>
</html>
