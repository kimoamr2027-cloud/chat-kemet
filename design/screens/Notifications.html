<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شات كيمت - الإشعارات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A4E14}a:hover{color:#5C3A0E}
.kemet-bg{background-color:#F7F1E6;background-image:url(../assets/kemet-pattern.svg);background-size:200px 200px}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF8F4; font-family: 'Cairo', 'Tahoma', sans-serif; color: #1F1A14; display: flex; flex-direction: column">

  <div style="padding: 48px 12px 14px; background: #FFFFFF; border-bottom: 1px solid #ECE6DC; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Rooms.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1F1A14">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <h1 style="margin: 0; flex-grow: 1; font-size: 22px; font-weight: 800">الإشعارات</h1>
      <button type="button" onClick="{{readAll}}" style="height: 40px; padding: 0 12px; border: none; background: transparent; color: #7A4E14; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">قراءة الكل</button>
    </div>
    <div role="tablist" style="display: flex; gap: 8px; padding: 0 8px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div class="kemet-bg" style="flex-grow: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="n" hint-placeholder-count="7">
      <a href="{{n.href}}" style="{{n.card}}">
        <div style="position: relative; flex-shrink: 0">
          <div aria-hidden="true" style="{{n.avatar}}">{{n.initial}}</div>
          <span aria-hidden="true" style="{{n.badge}}">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.icon}}"></path></svg>
          </span>
        </div>
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; line-height: 1.6"><b>{{n.who}}</b> {{n.action}}</span>
          <sc-if value="{{n.hasQuote}}" hint-placeholder-val="{{ true }}">
            <span style="font-size: 13px; color: #6B6259; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.quote}}</span>
          </sc-if>
          <span style="font-size: 12px; color: #6B6259">{{n.time}}</span>
        </div>
        <sc-if value="{{n.unread}}" hint-placeholder-val="{{ true }}">
          <span aria-label="جديد" style="width: 10px; height: 10px; border-radius: 50%; background: {{accent}}; flex-shrink: 0"></span>
        </sc-if>
      </a>
    </sc-for>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <p style="margin: 40px 0; text-align: center; font-size: 15px; color: #6B6259">مفيش إشعارات هنا دلوقتي</p>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5A1C","options":["#8A5A1C","#1F1A14","#5B3FD1","#2E6E8E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all', read: false };
  }
  renderVals() {
    const accent = this.props.accent ?? '#8A5A1C';
    const icons = {
      reply: 'M9 14L4 9l5-5M4 9h10a6 6 0 0 1 6 6v3',
      dm: 'M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z',
      mention: 'M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0zM16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-4 7.5',
      react: 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',
      mod: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      room: 'M3 10l9-6 9 6v10H3z'
    };
    const badgeColors = { reply: '#1F5A75', dm: accent, mention: '#6A3A7E', react: '#B3261E', mod: '#2F6B3A', room: '#6B6259' };
    const tints = [['#F1E6D3', '#7A4E14'], ['#DCEBF2', '#1F5A75'], ['#EFE3F3', '#6A3A7E'], ['#E3EEDF', '#2F6B3A'], ['#F6E2DA', '#8A3B1E']];
    const all = [
      { type: 'reply', cat: 'mentions', who: 'سارة', action: 'ردّت على رسالتك في غرفة الأهرامات', quote: 'أنا كمان جاية!', time: 'من دقيقتين', href: 'Room.dc.html', t: 1, unread: true },
      { type: 'dm', cat: 'dms', who: 'أحمد', action: 'بعتلك رسالة خاصة', quote: 'تمام، نتقابل الجمعة', time: 'من ١٠ دقايق', href: 'DM.dc.html', t: 0, unread: true },
      { type: 'mention', cat: 'mentions', who: 'يوسف', action: 'ذكر اسمك في شباب كيمت', quote: 'يا جماعة اسألوا صاحبنا ده', time: 'من نص ساعة', href: 'Room.dc.html', t: 4, unread: true },
      { type: 'react', cat: 'mentions', who: 'منى', action: 'تفاعلت بقلب على رسالتك', quote: 'كل ما نكتر أحلى', time: 'من ساعة', href: 'Room.dc.html', t: 2, unread: false },
      { type: 'mod', cat: 'rooms', who: 'أحمد', action: 'خلّاك مشرف في غرفة الأهرامات', quote: '', time: 'النهارده ٨:٠٠', href: 'Room.dc.html', t: 0, unread: false },
      { type: 'dm', cat: 'dms', who: 'نور', action: 'بعتتلك ستيكر', quote: 'صباح الفل', time: 'أمس', href: 'DM.dc.html', t: 3, unread: false },
      { type: 'room', cat: 'rooms', who: 'تاريخ مصر القديمة', action: 'فيها نقاش جديد عن الفراعنة', quote: '', time: 'أمس', href: 'Room.dc.html', t: 2, unread: false }
    ];
    const tabBase = 'height: 36px; padding: 0 14px; border-radius: 18px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ';
    const tabs = [['all', 'الكل'], ['mentions', 'الإشارات'], ['dms', 'الخاص'], ['rooms', 'الغرف']].map(([id, label]) => {
      const sel = this.state.tab === id;
      return {
        label,
        sel: sel ? 'true' : 'false',
        style: tabBase + (sel ? 'border: none; background: ' + accent + '; color: #FFFFFF' : 'border: 1px solid #D9D2C7; background: #FFFFFF; color: #1F1A14'),
        pick: () => this.setState({ tab: id })
      };
    });
    const items = all.filter((n) => this.state.tab === 'all' || n.cat === this.state.tab).map((n) => {
      const unread = n.unread && !this.state.read;
      return {
        ...n,
        unread,
        hasQuote: !!n.quote,
        initial: n.who.charAt(0),
        icon: icons[n.type],
        card: 'text-decoration: none; color: #1F1A14; border-radius: 18px; padding: 12px; display: flex; align-items: flex-start; gap: 12px; border: 1px solid ' + (unread ? '#E8D3AE' : '#ECE6DC') + '; background: ' + (unread ? '#FFFBF3' : '#FFFFFF'),
        avatar: 'width: 48px; height: 48px; border-radius: ' + (n.type === 'room' ? '14px' : '50%') + '; background: ' + tints[n.t][0] + '; color: ' + tints[n.t][1] + '; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800',
        badge: 'position: absolute; bottom: -2px; left: -2px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #FFFFFF; display: flex; align-items: center; justify-content: center; background: ' + badgeColors[n.type]
      };
    });
    return { accent, tabs, items, empty: items.length === 0, readAll: () => this.setState({ read: true }) };
  }
}
</script>
</body>
</html>
