<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شات كيمت - الإعدادات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A4E14}a:hover{color:#5C3A0E}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; background: {{t.bg}}; font-family: 'Cairo', 'Tahoma', sans-serif; color: {{t.text}}; display: flex; flex-direction: column">

  <div style="padding: 48px 12px 12px; background: {{t.card}}; border-bottom: 1px solid {{t.line}}; display: flex; align-items: center; gap: 8px">
    <a href="Profile.dc.html" aria-label="رجوع" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: {{t.text}}">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">الإعدادات</h1>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 18px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 6px; font-size: 14px; font-weight: 700; color: {{t.sub}}">المظهر</h2>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 4px 14px">
        <div style="min-height: 56px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{t.line}}">
          <span style="flex-grow: 1; font-size: 15px; font-weight: 600">الوضع الليلي</span>
          <button type="button" role="switch" aria-checked="{{darkOn}}" aria-label="الوضع الليلي" onClick="{{toggleDark}}" style="{{darkSwitch}}"><span style="{{knob}}"></span></button>
        </div>
        <div style="min-height: 60px; display: flex; align-items: center; gap: 10px">
          <span id="lang-label" style="flex-grow: 1; font-size: 15px; font-weight: 600">اللغة</span>
          <div role="group" aria-labelledby="lang-label" style="display: flex; background: {{t.soft}}; border-radius: 12px; padding: 3px">
            <sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
              <button type="button" aria-pressed="{{l.sel}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 6px; font-size: 14px; font-weight: 700; color: {{t.sub}}">الإشعارات</h2>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 4px 14px">
        <sc-for list="{{notif}}" as="n" hint-placeholder-count="4">
          <div style="{{n.row}}">
            <span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{n.label}}</span>
            <button type="button" role="switch" aria-checked="{{n.on}}" aria-label="{{n.label}}" onClick="{{n.toggle}}" style="{{n.sw}}"><span style="{{n.knob}}"></span></button>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 6px; font-size: 14px; font-weight: 700; color: {{t.sub}}">الخصوصية</h2>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 8px">
        <span id="dm-who" style="font-size: 15px; font-weight: 700">مين يقدر يبعتلك رسائل خاصة؟</span>
        <div role="radiogroup" aria-labelledby="dm-who" style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{dmOpts}}" as="o" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{o.sel}}" onClick="{{o.pick}}" style="{{o.style}}">
              <span aria-hidden="true" style="{{o.dot}}"></span>
              <span style="display: flex; flex-direction: column; text-align: start">
                <span style="font-size: 15px; font-weight: 700">{{o.label}}</span>
                <span style="font-size: 12px; color: {{t.sub}}">{{o.hint}}</span>
              </span>
            </button>
          </sc-for>
        </div>
      </div>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 4px 14px">
        <sc-for list="{{privacy}}" as="p" hint-placeholder-count="2">
          <div style="{{p.row}}">
            <span style="flex-grow: 1; display: flex; flex-direction: column">
              <span style="font-size: 15px; font-weight: 600">{{p.label}}</span>
              <span style="font-size: 12px; color: {{t.sub}}">{{p.hint}}</span>
            </span>
            <button type="button" role="switch" aria-checked="{{p.on}}" aria-label="{{p.label}}" onClick="{{p.toggle}}" style="{{p.sw}}"><span style="{{p.knob}}"></span></button>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 6px; font-size: 14px; font-weight: 700; color: {{t.sub}}">الحظر</h2>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 4px 14px">
        <button type="button" aria-expanded="{{blockedExpanded}}" onClick="{{toggleBlocked}}" style="width: 100%; min-height: 56px; border: none; background: transparent; display: flex; align-items: center; gap: 10px; padding: 0; font-family: inherit; color: {{t.text}}; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B3261E" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6l12.8 12.8"></path></svg>
          <span style="flex-grow: 1; text-align: start; font-size: 15px; font-weight: 600">الأعضاء المحظورين</span>
          <span style="font-size: 14px; color: {{t.sub}}">{{blockedCount}}</span>
        </button>
        <sc-if value="{{showBlocked}}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{blockedList}}" as="b" hint-placeholder-count="2">
            <div style="min-height: 56px; display: flex; align-items: center; gap: 10px; border-top: 1px solid {{t.line}}">
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; font-weight: 800">{{b.initial}}</span>
              <span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{b.name}}</span>
              <button type="button" onClick="{{b.unblock}}" style="height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid {{t.line}}; background: transparent; color: {{t.text}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">إلغاء الحظر</button>
            </div>
          </sc-for>
          <sc-if value="{{noBlocked}}" hint-placeholder-val="{{ false }}">
            <p style="margin: 0; padding: 12px 0; border-top: 1px solid {{t.line}}; font-size: 14px; color: {{t.sub}}">مفيش حد محظور</p>
          </sc-if>
        </sc-if>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 6px; font-size: 14px; font-weight: 700; color: {{t.sub}}">الحساب</h2>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 4px 14px">
        <a href="Profile.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid {{t.line}}; text-decoration: none; color: {{t.text}}; font-size: 15px; font-weight: 600">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          تعديل بياناتي
        </a>
        <a href="Main.dc.html" style="min-height: 56px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: {{t.danger}}; font-size: 15px; font-weight: 700">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5"></path><path d="M10 8l-4 4 4 4M6 12h10"></path></svg>
          تسجيل الخروج
        </a>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#8A5A1C","options":["#8A5A1C","#1F1A14","#5B3FD1","#2E6E8E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      dark: false, lang: 'ar', dmWho: 'rooms', showBlocked: false,
      blocked: ['كريم', 'هاني'],
      on: { dms: true, mentions: true, rooms: false, sound: true, online: true, receipts: true }
    };
  }
  renderVals() {
    const accent = this.props.accent ?? '#8A5A1C';
    const s = this.state;
    const t = s.dark
      ? { bg: '#15120E', card: '#221D17', text: '#F3EDE3', sub: '#B9AE9F', line: '#3A322A', soft: '#2E2720', danger: '#F28B82', sel: '#3A2E1E', ring: '#D9A54A' }
      : { bg: '#FAF8F4', card: '#FFFFFF', text: '#1F1A14', sub: '#6B6259', line: '#ECE6DC', soft: '#F3EFE8', danger: '#B3261E', sel: '#FBF4E8', ring: accent };
    const sw = (on) => 'width: 52px; height: 32px; flex-shrink: 0; border: none; border-radius: 16px; padding: 3px; display: flex; cursor: pointer; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? (s.dark ? '#B07A1A' : accent) : (s.dark ? '#4A4038' : '#BDB3A6'));
    const knob = 'width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; display: block';
    const flip = (k) => () => { const on = Object.assign({}, this.state.on); on[k] = !on[k]; this.setState({ on }); };
    const rowList = (list) => list.map(([k, label, hint], i) => ({
      label, hint: hint || '',
      on: s.on[k] ? 'true' : 'false',
      sw: sw(s.on[k]),
      knob,
      toggle: flip(k),
      row: 'min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 6px 0; ' + (i < list.length - 1 ? 'border-bottom: 1px solid ' + t.line : '')
    }));
    const notif = rowList([['dms', 'الرسائل الخاصة'], ['mentions', 'الإشارات والردود'], ['rooms', 'كل رسائل الغرف'], ['sound', 'صوت الإشعارات']]);
    const privacy = rowList([['online', 'إظهار إني متصل', 'الناس تشوف النقطة الخضرا جنب اسمك'], ['receipts', 'علامة القراءة', 'لو قفلتها مش هتشوف علامة قراءة الناس برضه']]);
    const dmOpts = [
      ['all', 'كل الأعضاء', 'أي حد في شات كيمت'],
      ['rooms', 'الأعضاء اللي معايا في الغرف', 'بس الناس اللي في نفس غرفك'],
      ['none', 'محدش', 'محدش يقدر يبدأ معاك محادثة خاصة']
    ].map(([id, label, hint]) => {
      const on = s.dmWho === id;
      return {
        label, hint,
        sel: on ? 'true' : 'false',
        style: 'min-height: 58px; border-radius: 14px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; font-family: inherit; color: ' + t.text + '; cursor: pointer; ' + (on ? 'border: 2px solid ' + t.ring + '; background: ' + t.sel : 'border: 1.5px solid ' + t.line + '; background: transparent'),
        dot: 'width: 18px; height: 18px; box-sizing: border-box; border-radius: 50%; flex-shrink: 0; background: ' + t.card + '; border: ' + (on ? '6px solid ' + t.ring : '2px solid ' + t.sub),
        pick: () => this.setState({ dmWho: id })
      };
    });
    const langs = [['ar', 'العربية'], ['en', 'English']].map(([id, label]) => {
      const on = s.lang === id;
      return {
        label,
        sel: on ? 'true' : 'false',
        style: 'height: 40px; padding: 0 14px; border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; ' + (on ? 'background: ' + t.card + '; color: ' + t.text + '; box-shadow: 0 1px 4px rgba(0,0,0,0.12)' : 'background: transparent; color: ' + t.sub),
        pick: () => this.setState({ lang: id })
      };
    });
    const ar = (n) => String(n).replace(/[0-9]/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);
    return {
      t,
      darkOn: s.dark ? 'true' : 'false',
      darkSwitch: sw(s.dark),
      knob,
      toggleDark: () => this.setState({ dark: !this.state.dark }),
      langs, notif, privacy, dmOpts,
      blockedExpanded: s.showBlocked ? 'true' : 'false',
      showBlocked: s.showBlocked,
      toggleBlocked: () => this.setState({ showBlocked: !this.state.showBlocked }),
      blockedCount: ar(s.blocked.length),
      noBlocked: s.blocked.length === 0,
      blockedList: s.blocked.map((name) => ({ name, initial: name.charAt(0), unblock: () => this.setState({ blocked: this.state.blocked.filter((x) => x !== name) }) }))
    };
  }
}
</script>
</body>
</html>
